<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- white rounded tile with a thin border (matches the launcher: white bg,
       black padlock) — the border keeps it visible on a white README page -->
  <rect x="1.5" y="1.5" width="105" height="105" rx="22" ry="22"
        fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <!-- shackle -->
  <path stroke="#000000" stroke-width="6" fill="none"
        d="M45,52 L45,45 a9,9 0 0 1 18,0 L63,52"/>
  <!-- lock body -->
  <path fill="#000000"
        d="M43,52 L65,52 a4,4 0 0 1 4,4 L69,72 a4,4 0 0 1 -4,4 L43,76 a4,4 0 0 1 -4,-4 L39,56 a4,4 0 0 1 4,-4 Z"/>
  <!-- white keyhole: dot + stem -->
  <path fill="#FFFFFF" d="M51,62 a3,3 0 1 0 6,0 a3,3 0 1 0 -6,0 Z"/>
  <path fill="#FFFFFF" d="M52.6,64 h2.8 l0.9,8 h-4.6 z"/>
</svg>
