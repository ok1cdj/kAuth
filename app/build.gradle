plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Read signing config from local.properties (gitignored).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def prop = { String key, String fallback -> localProps.getProperty(key, fallback) }

android {
    namespace 'com.ok1cdj.kauth'
    compileSdk 37

    defaultConfig {
        applicationId "com.ok1cdj.kauth"
        minSdk 29
        targetSdk 37
        versionCode 2
        versionName "1.1"
    }

    sourceSets {
        main {
            kotlin.srcDirs = ['src/main/kotlin']
        }
    }

    // Reuse the SAME keystore for every build, or app updates fail with
    // "signatures do not match". Keystore + passwords live outside the repo.
    def storeFilePath = prop('signing.storeFile', '')
    if (storeFilePath && rootProject.file(storeFilePath).exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(storeFilePath)
                storePassword prop('signing.storePassword', '')
                keyAlias prop('signing.keyAlias', '')
                keyPassword prop('signing.keyPassword', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (storeFilePath && rootProject.file(storeFilePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true // expose VERSION_NAME for the About dialog
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// AGP 9 built-in Kotlin: jvmTarget is set via the kotlin compilerOptions DSL
// (the old android.kotlinOptions block was removed).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // TOTP/HOTP engine, otpauth parsing, migration decoding, vault crypto — pure
    // Kotlin/JVM, unit-tested without Android.
    implementation project(':core')

    // Mudita Mindful Design — e-ink Compose components (no ripple, jump-scroll).
    // Coordinate 'MMD' redirects to the Android artifact 'MMD-android' via
    // Gradle module metadata; resolved from Maven Central.
    implementation 'com.mudita:MMD:1.0.2'

    // Compose (BOM pins the 1.7.x line that MMD-android 1.0.2 requires).
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.compose_bom_version}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Persistence — the encrypted vault blob lives in Preferences DataStore (no Room).
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // One-shot QR capture: CameraX (no Google Play Services / GMS).
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    // QR decoding — ZXing core only (pure Java, no Android/GMS scanner UI).
    implementation 'com.google.zxing:core:3.5.3'

    // SAF backup export/restore.
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Optional biometric unlock (BiometricPrompt + Keystore-bound key).
    implementation 'androidx.biometric:biometric:1.1.0'

    // Force a modern Fragment. biometric:1.1.0 transitively pins
    // fragment:1.2.5, whose FragmentActivity still validates activity-result
    // request codes to the lower 16 bits. androidx.activity 1.10.1's
    // ActivityResultRegistry generates codes above that range, so launching any
    // ActivityResultContract (camera permission, SAF export/restore) throws
    // "Can only use lower 16 bits for requestCode" and crashes. Fragment 1.3.0+
    // delegates to the registry and drops that check.
    implementation 'androidx.fragment:fragment:1.8.6'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
